name: Build deb

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 必须用 macOS runner：需要 iphoneos SDK 与 xcrun（lipo / codesign / clang）。
    # 不用 Ubuntu + Theos 的原因：Theos 要 clone 整个仓库再下 SDK，
    # 在这台脆弱链路上多一个失败点，而本项目不需要 Theos 的打包能力
    # （deb 由 pack.py 手工构造，格式完全可控）。
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "== xcode =="
          xcodebuild -version || true
          echo "== SDK =="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          echo "== clang =="
          xcrun --sdk iphoneos -f clang
          echo "== python =="
          python3 --version

      - name: 静态检查（本地 18 项）
        run: |
          python3 lint.py || {
            echo "::error::静态检查未通过，禁止继续构建"
            exit 1
          }

      - name: 声明一致性校验
        run: |
          python3 check_decls.py || {
            echo "::error::函数声明与调用不一致"
            exit 1
          }

      - name: ar 解析边界测试
        run: |
          # 必须覆盖奇数长度成员。此前 verify_deb 在奇数长度下偏移多走 1 字节，
          # 本地恰好全是偶数长度所以没暴露，CI 上直接崩。边界值要显式构造。
          python3 test_ar.py || {
            echo "::error::ar 解析边界测试失败"
            exit 1
          }

      - name: 打包逻辑离线测试
        run: |
          python3 test_pack.py || {
            echo "::error::打包逻辑测试失败"
            exit 1
          }

      - name: 确认预置文件存在
        run: |
          # test_pack.py 曾在真实 layout 上做删除测试，把交付文件删掉导致 CI 失败。
          # 现在测试已隔离到临时目录，这里再确认一次生产文件完好。
          test -f layout/DEBIAN/postinst \
            || { echo "::error::postinst 缺失（负责 chown 日志目录）"; exit 1; }
          test -f layout/Library/MobileSubstrate/DynamicLibraries/ShortcutsLagFix.plist \
            || { echo "::error::注入过滤 plist 缺失"; exit 1; }
          # data.tar 绝不能带 /var/mobile 条目：dpkg 会以 root 属主创建目录，
          # 而 App 跑在 mobile 下，写不进去 -> 日志目录永远为空。
          test ! -e layout/var \
            || { echo "::error::layout/var 存在，日志目录会被建成 root 属主"; exit 1; }
          echo "预置文件完好"

      - name: postinst 属主修复守卫
        run: |
          # 真实事故：日志目录 /var/mobile/Library/Logs/ShortcutsLagFix 曾被
          # data.tar 以 root:wheel 755 创建，App(mobile) 建不了文件，
          # 于是「装了插件但日志目录是空的」，看起来像插件根本没被加载。
          #
          # 修复方式：目录改由 postinst 创建并 chown 给 mobile。
          # 这里断言 postinst 真的做了这件事，否则等于没修。
          # 注意读原始文件，不用 $(cat ...)：命令替换会吃掉尾随换行，
          # 而「末尾必须有换行」本身就是一条要守的约束。
          test -x layout/DEBIAN/postinst || chmod +x layout/DEBIAN/postinst
          head -1 layout/DEBIAN/postinst | grep -qx '#!/bin/sh' \
            || { echo "::error::postinst 缺少 #!/bin/sh"; exit 1; }
          grep -q 'Logs/ShortcutsLagFix' layout/DEBIAN/postinst \
            || { echo "::error::postinst 未提及日志目录"; exit 1; }
          grep -q 'chown' layout/DEBIAN/postinst \
            || { echo "::error::postinst 未 chown，日志目录仍归 root"; exit 1; }
          # 末尾换行：直接看最后一个字节
          [ "$(tail -c 1 layout/DEBIAN/postinst | od -An -c | tr -d ' \n')" = '\n' ] \
            || { echo "::error::postinst 末尾缺换行"; exit 1; }
          echo "postinst 守卫通过"

      - name: 版本号与预热守卫
        run: |
          # 1) 版本号只能有一个真源：control。
          #    实测事故：SLFCommon.h 曾把版本写死成 "1.0.0"，之后 control 依次
          #    升到 1.0.1/1.0.2/1.0.3，而三次交付的 dylib 全都自报 v1.0.0，
          #    害我误以为用户装的是旧包。这条守卫防止它被写回去。
          #
          #    注意排除 0.0.0-unknown：那是 #ifndef 的兜底值，本来就该留在
          #    源码里（构建脚本漏注入时要靠它把问题暴露出来）。
          #    第一版守卫漏了这个排除，结果自己把合法兜底判成违规，白失败一轮。
          hardcoded="$(grep -nE '^[[:space:]]*#define[[:space:]]+SLF_VERSION[[:space:]]+"[0-9]' \
                         ShortcutsLagFix/SLFCommon.h | grep -v 'unknown' || true)"
          if [ -n "$hardcoded" ]; then
            echo "::error::SLFCommon.h 又把版本号写死了；版本必须由 build.sh 从 control 注入"
            echo "命中行：$hardcoded"
            exit 1
          fi

          # 2) build.sh 必须真的做了注入。少了它日志会自报 0.0.0-unknown。
          grep -q 'DSLF_VERSION' build.sh \
            || { echo "::error::build.sh 未把 SLF_VERSION 注入编译参数"; exit 1; }

          # 3) 预热源文件必须参与编译（否则预热代码只是躺在仓库里）。
          grep -q 'SLFWarmup.m' build.sh \
            || { echo "::error::build.sh 的 SOURCES 里没有 SLFWarmup.m"; exit 1; }

          # 4) 预热相关的系统框架必须链接，否则日志里的耗时只会是 0。
          #    注意：v1.0.5 起**不再**要求 NaturalLanguage —— 语言分析预热已整段移除。
          for fw in CoreText ImageIO; do
            grep -q "framework $fw" build.sh \
              || { echo "::error::build.sh 未链接 $fw"; exit 1; }
          done

          # 5) 预置配置要含预热开关，便于用户关闭对比。
          grep -q 'WarmupEnabled' layout/DEBIAN/postinst \
            || { echo "::error::postinst 内嵌配置缺 WarmupEnabled"; exit 1; }
          grep -q 'WarmupDelayMS' layout/DEBIAN/postinst \
            || { echo "::error::postinst 内嵌配置缺 WarmupDelayMS"; exit 1; }
          grep -q 'WarmupStepTimeoutMS' layout/DEBIAN/postinst \
            || { echo "::error::postinst 内嵌配置缺 WarmupStepTimeoutMS"; exit 1; }

          # 6) ★ 预热默认值必须是 NO。
          #    实测证据（用户 v1.0.4 日志）：默认开启的预热里有一步跑了 21.6 秒，
          #    且与主线程争 CoreNLP/liblangid 锁，把主线程拖了 4 秒。
          #    这条守卫防止后续有人把它改回 true。
          grep -qE 'SLFBool\(@"WarmupEnabled",[[:space:]]*NO\)' \
                     ShortcutsLagFix/SLFWarmup.m \
            || { echo "::error::WarmupEnabled 的代码内默认值必须为 NO（实测会与主线程争锁）"; exit 1; }

          # 7) ★ 语言分析预热不得加回来。
          #    NLTokenizer / NLTagger 会触发 CoreNLP + liblangid 初始化，
          #    而主线程的 AutoFillUI 也在用同一套东西。加回来就会重现 v1.0.4 的问题。
          #    如果哪天真要恢复，必须先有无可争议的 A/B 数据，并同步放开这条守卫。
          #    只匹配真实调用，别去碰注释里解释"为什么删掉它"的那几行。
          if grep -nE '\[\[NLTokenizer|\[\[NLTagger|NLTagScheme' ShortcutsLagFix/*.m ; then
            echo "::error::检测到 NLTagger/NLTokenizer 调用：语言分析预热会与主线程争 CoreNLP 锁，禁止加入"
            exit 1
          fi

          # 8) ★ 偏移量只允许走 image 基址。
          #    1.0.4 在 dli_saddr <= addr 时把偏移改回 addr - dli_saddr，
          #    因 PAC 残留导致整个栈不可符号化。这条守卫防止它被写回去。
          #    判据：outOff 与 dli_saddr 不得出现在同一行（正确实现里它们必然分行）。
          if grep -nE 'outOff.*dli_saddr' ShortcutsLagFix/SLFWatchdog.m ; then
            echo "::error::偏移量不得用 dli_saddr 计算，必须用 image 基址（PAC 残留会让结果不可符号化）"
            exit 1
          fi

          # 9) ★ 段内抽稀必须存在。
          #    实测事故：1.0.5 的注释写着"同一段只抓一次"，代码里没实现，
          #    40 次配额在 9.8 秒内被同一段烧光，导致 21.89s / 5.20s / 3.17s
          #    三段一条栈都没有 —— 工具在最该记录的地方失明。
          #    判据：抽稀要用到 gSegLastCaptureNS，且间隔来自 StallResampleMS。
          grep -q 'gSegLastCaptureNS' ShortcutsLagFix/SLFWatchdog.m \
            || { echo "::error::缺少段内抽稀（gSegLastCaptureNS）：同一段的重复上报会烧光抓栈配额"; exit 1; }
          grep -q 'StallResampleMS' ShortcutsLagFix/SLFWatchdog.m \
            || { echo "::error::缺少 StallResampleMS 配置项"; exit 1; }
          grep -q 'StallMaxCapturesPerSegment' ShortcutsLagFix/SLFWatchdog.m \
            || { echo "::error::缺少单段抓栈上限 StallMaxCapturesPerSegment"; exit 1; }

          # 10) ★ 偏移归属必须由 dyld image 表决定。
          #     实测两连败：1.0.4 用 dli_saddr 相减（PAC 残留，负数），
          #     1.0.5 用"右截 40/32 位"猜 PAC（截完必然小于 image 基址，全部不满足），
          #     两版都产出 663 帧不可符号化的偏移。
          #     根因是同一个：**一旦地址被污染，就没有可靠办法判断哪些位可信**。
          #     现在的做法是彻底不问这个问题，改问"它落在哪个 image 里"。
          for sym in SLFBuildImageTable _dyld_get_image_header ptrauth_strip; do
            grep -q "$sym" ShortcutsLagFix/SLFWatchdog.m               || { echo "::error::缺少 $sym：偏移归属必须由 dyld image 表 + ptrauth 剥离决定"; exit 1; }
          done
          if grep -nE 'SLFRealignToBase' ShortcutsLagFix/*.m ; then
            echo "::error::检测到 SLFRealignToBase：猜位重建已被证明不可靠，禁止复活"
            exit 1
          fi

          # 11) ★ 必须保留「在执行 vs 卡在等待」判据。
          #     心跳是 dispatch_async(main_queue)，结构上无法区分
          #     "主线程卡死" 与 "主队列积压"，两者都会让心跳停住。
          #     而 run_state 实测在 66 次采样里全报 WAITING，
          #     与 PC 持续变化的事实矛盾 —— 它不能当判据，只能当观测项。
          grep -q 'THREAD_BASIC_INFO' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::缺少 thread_info 观测（run_state 原始值）"; exit 1; }
          grep -q 'gSegCPUusSum' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::缺少 CPU 增量判据（gSegCPUusSum）：run_state 不可信，必须用 CPU 时间做主判据"; exit 1; }
          grep -q '本段平均 CPU 占用率' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::段结算缺少 CPU 占用率输出"; exit 1; }
          grep -q '本段 run_state 原始值' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::缺少 run_state 原始分布自证行"; exit 1; }

          # 11b) ★ run_state 的「其他」必须用自身基数统计。
          #     实测事故（1.0.7 日志）：写成 samples - RUNNING - WAITING - UNINTERRUPTIBLE，
          #     但 samples 是「CPU 增量成功计算」的次数，直方图却是每次 tick 都加，
          #     两个不同基数相减 → 32/33 段打印出「其他 -1」，
          #     还出现 RUNNING 2 / WAITING 1 却 samples=2 的自相矛盾（2+1=3>2）。
          grep -q 'gSegRunStateSamples' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::run_state 缺少自身采样基数 gSegRunStateSamples，「其他」会算出负数"; exit 1; }
          # 反向守卫：绝不允许再用 CPU 的 samples 去减 run_state 的直方图。
          if grep -q 'samples - atomic_load(&gSegRunStateHist' ShortcutsLagFix/SLFWatchdog.m; then
            echo "::error::仍用 samples 减 run_state 直方图 —— 基数不同，必然出负数"
            exit 1
          fi

          # 11c) ★ 栈快照偏差必须写进日志。
          #     抓栈只在检测到阻塞时触发，抓到的是主线程被唤醒那一刻的代码；
          #     而 CPU 是整段累计值。两者会给出「栈顶在 SwiftUI 算、CPU 只有 4%」
          #     的矛盾画面。不点破就会让人去找"哪段 SwiftUI 代码慢"，方向从一开始就错。
          grep -q '主线程绝大部分时间在睡/等' ShortcutsLagFix/SLFWatchdog.m             || { echo "::error::缺少栈快照偏差的判读提示（CPU 低时栈不代表耗时原因）"; exit 1; }

          # 12) postinst 必须预置两个新键，否则用户无法调段内抽稀。
          for k in StallResampleMS StallMaxCapturesPerSegment; do
            grep -q "$k" layout/DEBIAN/postinst               || { echo "::error::postinst 内嵌配置缺 $k"; exit 1; }
          done

          # 13) ★ 中文字面量不得走 %s。
          #     实测事故（1.0.6 日志）：诊断结论行用 %s 传中文，
          #     而 -[NSString initWithFormat:] 的 %s 按 MacRoman 解释字节，
          #     「在持续变化」变成「Âú®ÊÅÁª≠ÂèòÂåñ」、「存在」变成「Â≠òÂú®」。
          #     乱码的正是最需要读的两行结论 —— 工具在最关键处自毁可读性。
          #     判据：这两处必须是完整的 @"..." 字面量（含前导 @ 与结尾引号），
          #     而不是裸 "..."。用整串精确匹配，避免"匹配到注释里的同名词"这种假通过。
          # 判据分两步：先确认这段中文存在，再确认它所在行带 @" 前导。
          # 直接 grep 完整字面量容易被中间的箭头/空格绊倒（第一版就栽在这）。
          hit="$(grep -nF 'PC 在持续变化，倾向在推进' ShortcutsLagFix/SLFWatchdog.m || true)"
          if [ -z "$hit" ]; then
            echo "::error::找不到「PC 在持续变化」结论行（是不是被删了？）"
            exit 1
          fi
          if ! printf '%s' "$hit" | grep -qF '@"'; then
            echo "::error::「PC 在持续变化」必须写成 @\"...\" 形态，不能走 %s（会按 MacRoman 变乱码）"
            echo "命中行：$hit"
            exit 1
          fi
          if ! grep -qF '@"存在" : @"缺失"' ShortcutsLagFix/SLFWatchdog.m ; then
            echo "::error::「存在/缺失」必须写成 @\"...\" 形态，不能走 %s（会按 MacRoman 变乱码）"
            exit 1
          fi

          echo "版本与预热守卫通过"


      - name: roothide 包格式专项守卫
        run: |
          # 本次真实事故（用户设备安装失败）的固化检查。
          #
          # 背景：Architecture 是【包布局标志】，不是 CPU 架构。
          #   iphoneos-arm   = rootful
          #   iphoneos-arm64 = rootless (/var/jb)
          #   iphoneos-arm64e= roothide（随机 bootstrap 前缀）
          # 曾误写成 iphoneos-arm64，Sileo 拒绝安装：
          #   "You can contact the developer of this package to update it for roothide"
          # 用 roothide Patcher 强转后路径被重映射出 ./rootfs/，dpkg 报：
          #   error creating directory './rootfs/Library/MobileSubstrate':
          #   Operation not permitted
          #
          # 关键点：这里的比对必须是【整行精确相等】。
          # 若写成 grep -q "iphoneos-arm64"，"iphoneos-arm64e" 同样会命中，
          # 这个检查就成了永远通过的死检查 —— 正是它导致错误包被交付出去。
          grep -qx "Architecture: iphoneos-arm64e" control || {
            echo "::error::control 的 Architecture 不是 iphoneos-arm64e（roothide 包布局），设备上会装不上"
            exit 1
          }

          # 包结构必须是纯 rootful：不许自带 /var/jb 或 rootfs 前缀
          if grep -qE "^(/var/jb|\./var/jb|rootfs/)" control; then
            echo "::error::control 含路径前缀，roothide 包不应自带"
            exit 1
          fi
          echo "roothide 包格式守卫通过"

      - name: control 语法守卫（dpkg 可解析性）
        run: |
          # 第二次真实事故的固化检查。用户设备上的 dpkg 报：
          #   parsing file '/Library/dpkg/tmp.ci/control' near line 8
          #   package 'com.liehuu.shortcutslagfix':
          #   end of file during value of field 'Depends' (missing final newline)
          #
          # 根因：control 最后一行末尾没有 '\n'。
          # 为什么之前没拦住：所有检查都读 ctrl.strip() 后的文本，
          # strip 恰好抹掉了"缺换行"这个事实 —— 检查方式掩盖了缺陷本身。
          #
          # 这里必须直接看原始字节，不能用 $(cat control)（命令替换会吃掉尾随换行）。
          python3 - <<'PYEOF'
          import sys
          data = open("control", "rb").read()
          fails = []
          if not data.endswith(b"\n"):
              fails.append("control 末尾缺少换行（dpkg: missing final newline）")
          if b"\r" in data:
              fails.append("control 含 CR(\\r)，dpkg 字段解析会错乱（换行需 LF）")
          if b"\n\n" in data:
              fails.append("control 含空行，字段段中不允许空行")
          for i, ln in enumerate(data.decode("utf-8", "replace").splitlines(), 1):
              if not ln.strip():
                  continue
              if ln[0] in " \t":
                  continue
              if ":" not in ln:
                  fails.append("第 %d 行不是 'Key: value': %r" % (i, ln))
              elif not ln.split(":", 1)[1].startswith(" ") and ln.split(":", 1)[1].strip():
                  fails.append("第 %d 行冒号后缺空格: %r" % (i, ln))
          if fails:
              for f in fails:
                  print("::error::" + f)
              sys.exit(1)
          print("control 语法守卫通过（%d 字节，末尾换行正确）" % len(data))
          PYEOF

      - name: 编译（arm64 + arm64e 双切片）
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 产物自证（架构 / 签名 / install_name）
        run: |
          echo "===== lipo -info ====="
          lipo -info build/ShortcutsLagFix.dylib

          echo "===== 逐架构 cputype/subtype ====="
          lipo -detailed_info build/ShortcutsLagFix.dylib | grep -E "architecture|align" || true

          echo "===== codesign ====="
          codesign -dv build/ShortcutsLagFix.dylib 2>&1 | head -8 || true

          echo "===== install_name ====="
          otool -D build/ShortcutsLagFix.dylib || true

          echo "===== 导出符号（应只有构造函数与少量入口）====="
          nm -gU build/ShortcutsLagFix.dylib | head -20 || true

          echo "===== 硬闸门：必须双切片 ====="
          INFO="$(lipo -info build/ShortcutsLagFix.dylib)"
          echo "$INFO"
          echo "$INFO" | grep -q arm64e || { echo "::error::缺少 arm64e 切片，在用户 arm64e 设备上会静默失效"; exit 1; }
          echo "$INFO" | grep -q arm64  || { echo "::error::缺少 arm64 切片"; exit 1; }

      - name: 打包 deb
        run: |
          python3 pack.py

      - name: 交付前产物验尸（对真实 deb 逐项检查）
        run: |
          # 对最终产物再独立验一遍：架构双切片、签名、注入过滤、
          # 预置配置、关键字符串、install_name。
          DEB=$(ls debs/*.deb | head -1)
          python3 verify_artifact.py "$DEB" || {
            echo "::error::产物体检未通过，禁止交付"
            exit 1
          }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutsLagFix-deb
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 上传 dylib（便于对照排查）
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutsLagFix-dylib
          path: build/ShortcutsLagFix.dylib
          if-no-files-found: error
          retention-days: 14

      - name: 汇总信息
        if: always()
        run: |
          echo "### 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/ShortcutsLagFix.dylib ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            lipo -info build/ShortcutsLagFix.dylib >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          ls -lh debs/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true